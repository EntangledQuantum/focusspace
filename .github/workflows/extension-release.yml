name: Chrome extension release

# Publishes extension/ as a zip on a GitHub release tagged extension-v<version>.
# Either push a tag like `extension-v0.9.0-beta`, or run this workflow by hand
# (Actions → Chrome extension release → Run workflow), which tags the current
# commit from manifest.json's version plus an optional channel suffix.
# Tags containing "beta"/"alpha"/"rc" become pre-releases.
on:
  push:
    tags: ["extension-v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Suffix after the manifest version (e.g. beta, rc1). Empty = stable."
        required: false
        default: "beta"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          manifest=$(jq -r .version extension/manifest.json)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            ver="${tag#extension-v}"
            case "$ver" in
              "$manifest"|"$manifest"-*) ;;
              *) echo "::error::tag $tag does not match manifest version $manifest"; exit 1 ;;
            esac
          else
            ver="$manifest${CHANNEL:+-$CHANNEL}"
            tag="extension-v$ver"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "release $tag"

      - name: Build zip
        run: |
          name="focusspace-extension-$VER.zip"
          (cd extension && zip -r -X "../$name" . -x "README.md" -x "*.DS_Store")
          unzip -l "$name"
          echo "ZIP=$name" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *beta*|*alpha*|*rc*) pre="--prerelease" ;; esac
          gh release create "$TAG" "$ZIP" $pre --target "$GITHUB_SHA" \
            --title "FocusSpace Chrome extension $VER" \
            --notes "$(cat <<'NOTES'
          Beta of the FocusSpace Chrome extension: live timer, session, project/task and subtasks, Spotify now playing,
          and controls (start/pause/resume/stop/skip, complete task, tick subtasks, switch project/task, music) —
          synced both ways with focusspace.live.

          **Install:** download the zip below and unzip it → `chrome://extensions` → enable **Developer mode** →
          **Load unpacked** → pick the unzipped folder → click the FocusSpace icon → **Log in** (uses your
          focusspace.live session; revoke any time in Settings → Agents & MCP).
          NOTES
          )"
